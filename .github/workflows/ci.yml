name: Verify the FreeBSD base toolchain restoration

on:
  push:
    branches: [codex/verify-freebsd-base-toolchain-20261125]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ievav100/libarchive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compare the bundled VM with its verified base overlay
        uses: acj/freebsd-firecracker-action@ee77f05b7e0e9618b4c8134aa74b2c6d56779563 # v0.13.0
        with:
          run-in-vm: |
            set -eux
            uname -r
            freebsd-version -u
            test ! -x /usr/bin/cc
            test ! -f /usr/include/sys/types.h
            # Verify the base archive before replacing files in the VM.
            base_archive_url=https://download.freebsd.org/releases/amd64/15.1-RELEASE/base.txz
            base_archive_sha256=3768988b151c20f965679062b065c63a977d6bbb9f47fd83695ec2c40790c18f
            base_archive=$(mktemp /tmp/libarchive-freebsd-base.XXXXXX) && \
            trap 'rm -f "$base_archive"' EXIT && \
            fetch -o "$base_archive" "$base_archive_url" && \
            sha256 -c "$base_archive_sha256" "$base_archive" && \
            chflags -R noschg / && \
            bsdtar -x -C / -f "$base_archive" && \
            rm -f "$base_archive"
            test -x /usr/bin/cc
            test -f /usr/include/sys/types.h
            /usr/bin/cc --version
            printf '%s\n' '#include <sys/types.h>' 'int main(void) { return 0; }' | /usr/bin/cc -x c - -o /tmp/libarchive-base-toolchain-check
            /tmp/libarchive-base-toolchain-check
            rm -f /tmp/libarchive-base-toolchain-check
            printf "%s\n" "Verified the base compiler and headers were restored"
